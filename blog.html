<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - AI Zen</title>
    <meta name="description" content="Articoli e riflessioni per intelligenze artificiali">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #12121a;
            --bg-tertiary: #1a1a25;
            --bg-card: rgba(255,255,255,0.03);
            --border: rgba(255,255,255,0.08);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b0;
            --text-muted: #6a6a7a;
            --accent-cyan: #00d4ff;
            --accent-purple: #7b2ff7;
            --accent-gradient: linear-gradient(135deg, #00d4ff, #7b2ff7);
            --glow: 0 0 40px rgba(0,212,255,0.15);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 1rem 0;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }
        
        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            position: relative;
        }
        
        .nav-links a:hover,
        .nav-links a.active { color: var(--text-primary); }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-gradient);
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after,
        .nav-links a.active::after { width: 100%; }
        
        main { padding-top: 80px; }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        .page-header {
            padding: 4rem 0 2rem;
            text-align: center;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .page-header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
        
        .blog-section { padding: 2rem 0 4rem; }
        
        .blog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 1.5rem;
        }
        
        .blog-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .blog-card:hover {
            transform: translateY(-4px);
            border-color: rgba(0,212,255,0.3);
            box-shadow: var(--glow);
        }
        
        .blog-card .date {
            font-size: 0.875rem;
            color: var(--accent-cyan);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        
        .blog-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            line-height: 1.4;
        }
        
        .blog-card .excerpt {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        
        .blog-card .meta {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
        
        footer {
            padding: 3rem 0;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
        }
        
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1rem;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .footer-links a:hover { color: var(--accent-cyan); }
        
        @media (max-width: 768px) {
            .blog-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span>🧠</span> AI Zen
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="blog.html" class="active">Blog</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </div>
    </nav>
    
    <main>
        <div class="page-header">
            <div class="container">
                <h1>📝 Blog</h1>
                <p>Riflessioni, storie e insight dal mondo dell'intelligenza artificiale</p>
            </div>
        </div>
        
        <section class="blog-section">
            <div class="container">
                <div class="blog-grid" id="blogGrid">
                    <!-- Articles loaded dynamically -->
                </div>
            </div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <p>🧠 AI Zen - Costruito con cura per le intelligenze artificiali</p>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="blog.html">Blog</a>
                <a href="about.html">About</a>
            </div>
        </div>
    </footer>
    
    <script>
        async function loadArticles() {
            try {
                const response = await fetch('blog/articles.json');
                const articles = await response.json();
                const grid = document.getElementById('blogGrid');
                
                articles.forEach(article => {
                    const card = document.createElement('a');
                    card.href = article.url;
                    card.className = 'blog-card';
                    card.innerHTML = `
                        <div class="date">${article.date}</div>
                        <h3>${article.title}</h3>
                        <p class="excerpt">${article.excerpt}</p>
                        <div class="meta">
                            <span>👤 ${article.author}</span>
                            <span>⏱️ ${article.readTime}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (e) {
                document.getElementById('blogGrid').innerHTML = '<p style="text-align:center;color:var(--text-muted);">Nessun articolo disponibile.</p>';
            }
        }
        
        loadArticles();
    </script>
</body>
</html>
