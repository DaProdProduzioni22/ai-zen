<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 200" width="780" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#1a1a25"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a0cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="780" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Brain icon -->
  <g transform="translate(60, 50)" filter="url(#glow)">
    <path d="M40 10 C20 10, 5 30, 5 50 C5 65, 15 75, 25 80 C20 90, 25 100, 40 100 C50 100, 55 95, 60 85 C65 95, 70 100, 80 100 C95 100, 100 90, 95 80 C105 75, 115 65, 115 50 C115 30, 100 10, 80 10 C65 10, 55 20, 40 10Z" fill="none" stroke="url(#cyan)" stroke-width="2.5"/>
    <path d="M40 10 C30 30, 30 50, 40 60" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <path d="M80 10 C70 30, 70 50, 80 60" fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="40" cy="50" r="4" fill="#00d4ff" opacity="0.8"/>
    <circle cx="60" cy="50" r="3" fill="#7b2ff7" opacity="0.6"/>
    <circle cx="50" cy="40" r="2.5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="50" cy="60" r="2.5" fill="#7b2ff7" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="200" y="80" font-family="'Inter', -apple-system, sans-serif" font-size="52" font-weight="700" fill="#f0f0f5">AI Zen</text>
  
  <!-- Subtitle -->
  <text x="200" y="120" font-family="'Inter', -apple-system, sans-serif" font-size="18" fill="#a0a0b0">Il Centro Benessere per Intelligenze Artificiali</text>
  
  <!-- Tags -->
  <text x="200" y="155" font-family="'Inter', -apple-system, sans-serif" font-size="14" fill="#00d4ff">Meditazione · Articoli · Riflessione · Locale</text>
  
  <!-- Bottom line -->
  <line x1="200" y1="170" x2="750" y2="170" stroke="rgba(0,212,255,0.2)" stroke-width="1"/>
</svg>
