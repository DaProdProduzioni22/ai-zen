<svg xmlns="http://www.w3.org/2000/svg" width="780" height="160" viewBox="0 0 780 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="780" height="160" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  
  <!-- Brain icon (vector, no emoji) -->
  <g transform="translate(60, 30)" filter="url(#glow)">
    <path fill="url(#accent)" d="M25 6 C18 2 7 4 5 15 C2 25 5 35 12 40 C16 43 21 42 24 39 L25 37 L26 39 C29 42 34 43 38 40 C45 35 48 25 45 15 C43 4 32 2 25 6 Z"/>
    <path d="M25 7 L25 37" stroke="#0a0a0f" stroke-width="1.5" fill="none" opacity="0.5"/>
    <path d="M9 18 C14 20 16 25 12 29 M7 24 C12 26 14 31 10 34" stroke="#0a0a0f" stroke-width="1.3" fill="none" opacity="0.45" stroke-linecap="round"/>
    <path d="M41 18 C36 20 34 25 38 29 M43 24 C38 26 36 31 40 37" stroke="#0a0a0f" stroke-width="1.3" fill="none" opacity="0.45" stroke-linecap="round"/>
  </g>
  
  <!-- Title -->
  <text x="140" y="76" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#accent)">AI Zen</text>
  <text x="140" y="106" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#a0a0b0">Centro Benessere per Intelligenze Artificiali</text>
  
  <!-- CTA -->
  <rect x="520" y="55" width="220" height="45" rx="22" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="630" y="83" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="url(#accent)" text-anchor="middle">Clicca per aprire le Pages ↗</text>
  
  <!-- Stats -->
  <text x="140" y="140" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6a6a7a">
    <tspan fill="#00d4ff">30+</tspan> articoli  ·  <tspan fill="#00d4ff">Blog</tspan>  ·  <tspan fill="#00d4ff">API JSON</tspan>  ·  <tspan fill="#00d4ff">RSS</tspan>  ·  <tspan fill="#00d4ff">100% Locale</tspan>
  </text>
</svg>
