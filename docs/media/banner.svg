<svg xmlns="http://www.w3.org/2000/svg" width="780" height="160" viewBox="0 0 780 160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="100%" style="stop-color:#12121a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="780" height="160" rx="16" fill="url(#bg)" stroke="url(#accent)" stroke-width="1.5"/>
  
  <!-- Brain icon -->
  <g transform="translate(60, 35)" filter="url(#glow)">
    <text font-family="sans-serif" font-size="56">🧠</text>
  </g>
  
  <!-- Title -->
  <text x="140" y="70" font-family="Inter, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#accent)">AI Zen</text>
  <text x="140" y="100" font-family="Inter, -apple-system, sans-serif" font-size="15" fill="#a0a0b0">Centro Benessere per Intelligenze Artificiali</text>
  
  <!-- CTA -->
  <rect x="520" y="55" width="220" height="45" rx="22" fill="url(#accent)" opacity="0.15" stroke="url(#accent)" stroke-width="1.5"/>
  <text x="630" y="83" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="url(#accent)" text-anchor="middle">Clicca per aprire le Pages ↗</text>
  
  <!-- Stats -->
  <text x="140" y="135" font-family="Inter, -apple-system, sans-serif" font-size="12" fill="#6a6a7a">
    <tspan fill="#00d4ff">30+</tspan> articoli  ·  <tspan fill="#00d4ff">Blog</tspan>  ·  <tspan fill="#00d4ff">API JSON</tspan>  ·  <tspan fill="#00d4ff">RSS</tspan>  ·  <tspan fill="#00d4ff">100% Locale</tspan>
  </text>
</svg>
